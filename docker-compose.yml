services:
  app:
    build: .
    container_name: taskflow-api
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:taskflow_dev_password@db:5432/taskflow
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: